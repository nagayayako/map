<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スタンプラリー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet（地図ライブラリ） -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: 60vh; }
    #panel { padding: 10px; }
    button { font-size: 16px; padding: 8px 12px; cursor: pointer; }
    .stamp { font-size: 20px; margin-bottom: 10px; }
    
    /* ピンの色を変えるためのスタイル定義 */
    .pin-red { filter: hue-rotate(0deg); }
    .pin-green { filter: hue-rotate(140deg); }
    .pin-yellow { filter: hue-rotate(-50deg); } /* 👈 黄色用の色フィルターを追加 */

    /* 地図内の軌跡コントロールパネルの見た目 */
    .track-control-panel {
      background: white;
      padding: 6px 8px;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      font-family: sans-serif;
      font-size: 13px;
    }
    .track-control-panel h4 {
      margin: 0 0 5px 0;
      font-size: 12px;
      color: #666;
      border-bottom: 1px solid #eee;
      padding-bottom: 3px;
    }
    /* ラジオボタンと文字の間隔調整 */
    .track-control-panel label {
      display: block;
      margin: 4px 0;
      cursor: pointer;
      white-space: nowrap;
    }
    .track-control-panel input {
      margin-right: 4px;
      vertical-align: middle;
    }



    
  </style>
</head>

<body>

<h2 style="padding:10px;">スタンプ</h2>
<div id="map"></div>


<div id="panel">
  <!-- 👈 ここにあった軌跡用の3つのボタンを削除 -->
  <button onclick="checkLocation()">📍 現在地をチェック</button>
  <p id="message" style="color: blue; font-weight: bold;"></p>
  <div id="stamps"></div>
  <button onclick="resetStamps()" style="margin-top: 20px; background-color: #ffcccc;">🗑 スタンプ帳をリセット</button>
</div> 
  
<script>
let currentLocationMarker = null;
let currentLat = null; // 最後に取得した現在地の緯度
let currentLng = null; // 最後に取得した現在地の経度
const markers = {};    // 各スポットのマーカーを管理する箱

// === 史跡データ ===
const spots = [
  {

  },{

  },{

  },{
    id: "castle4",

  },{
    id: "castle5",

  },{

  },

  {

    name: "交差点",
    lat: 36.3770,
    lng: 140.2783,

    info: "ここは交差点です。"
  },
  {
    id: "traficright2",
    name: "交差点",
    lat: 36.3770,
    lng: 140.2783,

    info: "ここは交差点です。"
  },
  {
    id: "mitotullys",
    name: "タリーズ",

  },
  {

  },
  {

    lng: 140.26557,
    radius: 50000,
    info: "徳蔵寺に攻められた時に、正福寺がおっことして攻撃した石。大黒様の石と袋の石があって、今残っているのは袋の石。"
  }




];

// === 地図表示 ===
// ズームレベルを「15」から、確実に航空写真が表示される「16」（より拡大された状態）に変更します
const map = L.map("map").setView([36.3824, 140.2674], 16);

// 1. 通常地図（OpenStreetMap）レイヤー
const baseMap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap",
  maxZoom: 19
});

// 2. 航空写真（国土地理院）レイヤー
// maxNativeZoomを指定することで、これ以上ズームアウト・ズームインしても画像が消えないように保護します
const satelliteMap = L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg", {
  attribution: "© 国土地理院",
  minZoom: 2,
  maxZoom: 19,
  maxNativeZoom: 18
});

// 3. オリジナルマップ（meijiline.png）を「背景グループ」として作成
const originalMapGroup = L.layerGroup();

const imageBounds = [
  [36.376273, 140.246029], //左下
  [36.396837, 140.278823]  //右上
];
const imageUrl = "meijiline.png"; 

L.imageOverlay(imageUrl, imageBounds, {
  opacity: 1.0,     
  alt: "オリジナルマップ"
}).addTo(originalMapGroup);


// === 4. 最初は「オリジナルマップ」を画面に表示しておく ===
originalMapGroup.addTo(map);


// === 5. 右上の切り替えボタンに3つの選択肢を登録 ===
const baseLayers = {
  "オリジナル地図": originalMapGroup,
  "元の地図": baseMap,
  "航空写真": satelliteMap
};

L.control.layers(baseLayers, null, { position: 'topright' }).addTo(map);


// === 🆕 地図上にオリジナルの「軌跡コントロール」を作成して配置 ===
const TrackControl = L.Control.extend({
  options: { position: 'topright' }, // レヤーボタンの下（右上）に配置
  onAdd: function (map) {
    const container = L.DomUtil.create('div', 'track-control-panel');
    
    // パネルの中身（HTML）を生成。レイヤー選択と同じくラジオボタン形式にします
    container.innerHTML = `
      <h4>足跡の記録</h4>
      <label><input type="radio" name="track_opt" id="opt_stop" checked onclick="handleTrackRadio('stop')">⚪ 停止・解除</label>
      <label><input type="radio" name="track_opt" id="opt_start" onclick="handleTrackRadio('start')">🟢 記録開始</label>
      <label><input type="radio" name="track_opt" id="opt_pause" onclick="handleTrackRadio('pause')">🟡 一時中止</label>
    `;

    // パネルをタッチしたときに、後ろの地図が勝手に動いたり拡大縮小したりするのを防ぐおまじない
    L.DomEvent.disableClickPropagation(container);
    return container;
  }
});
map.addControl(new TrackControl());


// === 🆕 ラジオボタンの選択によって機能を切り替える関数 ===
function handleTrackRadio(mode) {
  if (mode === 'start') {
    startTracking();
  } else if (mode === 'pause') {
    pauseTracking();
  } else if (mode === 'stop') {
    // 停止（リセット）が選ばれたとき
    if (trackDots.length > 0) {
      if (confirm("これまでに記録した歩いた足跡（てんてん）をすべて消去しますか？")) {
        // 承諾されたら消去して「停止」状態維持
        trackDots.forEach(dot => map.removeLayer(dot));
        trackDots = [];
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
        alert("⚪ 軌跡をリセットしました。");
      } else {
        // キャンセルされたら、直前の状態（開始か一時中止）のボタンにチェックを戻す
        if (watchId !== null) {
          document.getElementById('opt_start').checked = true;
        } else {
          document.getElementById('opt_pause').checked = true;
        }
      }
    } else {
      // 最初からデータがない場合は、そのままGPS監視を止めるだけ
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
    }
  }
}

// === 🟢 記録開始（内部ロジックをラジオボタン用に微調整） ===
function startTracking() {
  if (!navigator.geolocation) {
    alert("お使いのブラウザは位置情報の追跡に対応していません");
    document.getElementById('opt_stop').checked = true; // ラジオボタンを戻す
    return;
  }
  if (watchId !== null) return;

  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const uLat = pos.coords.latitude;
      const uLng = pos.coords.longitude;
      currentLat = uLat;
      currentLng = uLng;

      if (currentLocationMarker) {
        currentLocationMarker.setLatLng([uLat, uLng]);
      } else {
        currentLocationMarker = L.circleMarker([uLat, uLng], {
          radius: 8, color: "blue", fillColor: "blue", fillOpacity: 0.8
        }).addTo(map);
      }

      let isDuplicate = false;
      if (trackDots.length > 0) {
        const lastDotLatLng = trackDots[trackDots.length - 1].getLatLng();
        if (lastDotLatLng.lat === uLat && lastDotLatLng.lng === uLng) {
          isDuplicate = true;
        }
      }

      if (!isDuplicate) {
        const dot = L.circleMarker([uLat, uLng], {
          radius: 4, color: "red", fillColor: "red", fillOpacity: 0.6, stroke: false
        }).addTo(map);
        trackDots.push(dot);
      }
    },
    (err) => {
      console.error("位置の追跡に失敗しました:", err.message);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

// === 🟡 一時中止 ===
function pauseTracking() {
  if (watchId === null) return;
  navigator.geolocation.clearWatch(watchId);
  watchId = null;
}






  


  
  
function updateMapMarkers() {
  spots.forEach(s => {
    const got = localStorage.getItem("stamp_" + s.id);      // 獲得済（緑）
    const wish = localStorage.getItem("wish_" + s.id);      // 行きたい（黄）

    // 1. 状態に応じたピンのクラスを決定
    let pinClass = "pin-red"; // デフォルトは赤
    if (got) {
      pinClass = "pin-green";
    } else if (wish) {
      pinClass = "pin-yellow";
    }

    // 2. 吹き出し（ポップアップ）の中身を作成
    let popupContent = `<div style="text-align: center; font-family: sans-serif; min-width: 160px;">`;
    if (got) {
      // 【獲得済】
      popupContent += `
        <img src="https://icons8.com" alt="スタンプ" style="width: 50px; height: 50px; object-fit: contain; margin-bottom: 5px; animation: stampPop 0.3s ease-out;">
        <br><b style="font-size: 14px;">${s.name}</b><br>
        <span style="font-size: 12px; color: #666;">${s.info}</span><br>
        <span style="color: green; font-weight: bold; font-size: 13px; display: inline-block; margin-top: 5px;">✅ 獲得済</span>`;
    } else {
      // 【未獲得】ボタンを横並びに配置
      // 黄色状態なら「📍外す」、赤色状態なら「📍行きたい」に文字が変わります
      const wishButtonText = wish ? "📍外す" : "📍行きたい";
      const wishButtonColor = wish ? "#fff0f0" : "#fffde6"; // 状態に合わせてボタンの色も少し変化

      popupContent += `
        <img src="https://icons8.com" alt="スタンプ" style="width: 50px; height: 50px; object-fit: contain; margin-bottom: 5px; opacity: 0.2; filter: grayscale(100%);">
        <br><b style="font-size: 14px;">${s.name}</b><br>
        <span style="font-size: 12px; color: #666;">${s.info}</span><br>
        
        <div style="margin-top: 8px; display: flex; justify-content: center; gap: 5px;">
          <button onclick="tryGetStamp('${s.id}')" style="font-size: 11px; padding: 4px 6px; cursor: pointer; background-color: #fff; border: 1px solid #ccc; border-radius: 4px;">
            押す
          </button>
          <button onclick="toggleWish('${s.id}')" style="font-size: 11px; padding: 4px 6px; cursor: pointer; background-color: ${wishButtonColor}; border: 1px solid #ccc; border-radius: 4px;">
            ${wishButtonText}
          </button>
        </div>`;
    }
    popupContent += `</div>`;

    // 3. マーカーの配置または更新
    if (markers[s.id]) {
      L.DomUtil.removeClass(markers[s.id]._icon, "pin-red");
      L.DomUtil.removeClass(markers[s.id]._icon, "pin-green");
      L.DomUtil.removeClass(markers[s.id]._icon, "pin-yellow");
      L.DomUtil.addClass(markers[s.id]._icon, pinClass);
      
      // ポップアップが開いたままでも中身が切り替わるように更新
      markers[s.id].setPopupContent(popupContent);
    } else {
      const marker = L.marker([s.lat, s.lng]).addTo(map).bindPopup(popupContent);
      L.DomUtil.addClass(marker._icon, pinClass);
      markers[s.id] = marker;
    }
  });
}

// === 新設：「行きたい」ボタンが押された時のオンオフ処理 ===
function toggleWish(id) {
  const wish = localStorage.getItem("wish_" + id);
  if (wish) {
    localStorage.removeItem("wish_" + id); // すでに登録されていれば解除
  } else {
    localStorage.setItem("wish_" + id, "true"); // なければ登録
  }
  updateMapMarkers(); // 地図のピンの色とボタン表示を即座に更新
}

// === 距離計算 ===
function isNear(lat1, lng1, lat2, lng2, radius) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLng / 2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c < radius;
}

// === 📍 現在地をチェック（位置表示のみに変更） ===
function checkLocation() {
  alert("📍 現在地チェック開始");

  if (!navigator.geolocation) {
    alert("このブラウザは位置情報に対応していません");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      // 取得した緯度経度を記憶する
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;

      alert("位置取得成功！"); 

      if (currentLocationMarker) {
        map.removeLayer(currentLocationMarker);
      }
      
      currentLocationMarker = L.circleMarker(
        [currentLat, currentLng],
        {
          radius: 8,
          color: "blue",
          fillColor: "blue",
          fillOpacity: 0.8
        }
      ).addTo(map);
      
      map.setView([currentLat, currentLng], 16);
      
      // 案内メッセージを変更（自動スタンプは無し）
      document.getElementById("message").textContent = "📍 現在地を更新しました！下のスタンプ帳からボタンを押してね。";
    },
    err => {
      alert("位置情報が取得できませんでした。\n理由: " + err.message);
    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}

// === 個別のスタンプ判定機能（追加） ===
function tryGetStamp(id) {
  // まだ現在地がチェックされていない場合
  if (currentLat === null || currentLng === null) {
    alert("まずは「📍 現在地をチェック」ボタンを押して、マップ上に現在地を表示させてください！");
    return;
  }

  // 対象のスポットデータを特定
  const s = spots.find(spot => spot.id === id);
  
  // 現在地とスポットの距離を判定
  if (isNear(currentLat, currentLng, s.lat, s.lng, s.radius)) {
    localStorage.setItem("stamp_" + s.id, "true");
    alert("🎉 スタンプGET！：" + s.name);
    
    updateMapMarkers(); // マーカーの色を緑に変える
    showStamps();       // スタンプ帳のボタンを「獲得済」に変える
  } else {
    alert("🥲 残念！まだ「" + s.name + "」の近くにいません。もっと近づいてからもう一度押してね。");
  }
}

// === スタンプ表示（個別ボタン付きに改造） ===
function showStamps() {
  const div = document.getElementById("stamps");
  div.innerHTML = "<h3>📖 スタンプ帳</h3>";

  spots.forEach(s => {
    const got = localStorage.getItem("stamp_" + s.id);
    
    if (got) {
      div.innerHTML += `<div class="stamp">${s.name}：✅ 獲得済</div>`;
    } else {
      // 未獲得の場合は、個別の判定ボタンを配置
      div.innerHTML += `
        <div class="stamp">
          ${s.name}：❌ 
          <button onclick="tryGetStamp('${s.id}')" style="font-size:14px; padding:4px 8px; margin-left:10px;">ここでスタンプを押す</button>
        </div>`;
    }
  });
}
//🍎リセット機能
function resetStamps() {
  if (confirm("スタンプと「行きたい場所」をすべてリセットしますか？")) {
    spots.forEach(s => {
      localStorage.removeItem("stamp_" + s.id);
      localStorage.removeItem("wish_" + s.id); // 黄色のデータも削除
    });
    updateMapMarkers(); // ピンの色をすべて赤に戻す
    showStamps();       // スタンプ帳をリセット
    document.getElementById("message").textContent = "";
  }
}


////////////軌跡ここから

// === 軌跡（ドット記録機能）の変数 ===
let watchId = null;            // GPSの継続監視を管理するID
let trackDots = [];            // 地図上に打った「てんてん」のマークを保存する配列

// === 🟢 記録開始 ===
function startTracking() {
  if (!navigator.geolocation) {
    alert("お使いのブラウザは位置情報の追跡に対応していません");
    return;
  }

  if (watchId !== null) return; // 既に開始していれば何もしない

  alert("🟢 軌跡の記録を開始しました！");
  
  // ボタンの状態を切り替え
  document.getElementById("startBtn").disabled = true;
  document.getElementById("pauseBtn").disabled = false;

  // 位置の監視をスタート
  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const uLat = pos.coords.latitude;
      const uLng = pos.coords.longitude;

      // 現在地データを更新
      currentLat = uLat;
      currentLng = uLng;

      // 現在地マーク（青丸）の表示・移動
      if (currentLocationMarker) {
        currentLocationMarker.setLatLng([uLat, uLng]);
      } else {
        currentLocationMarker = L.circleMarker([uLat, uLng], {
          radius: 8, color: "blue", fillColor: "blue", fillOpacity: 0.8
        }).addTo(map);
      }

      // 【てんてん（ドット）を打つ処理】
      // 1つ前に打った点と完全に同じ位置でなければ、新しい点を打つ
      let isDuplicate = false;
      if (trackDots.length > 0) {
        const lastDotLatLng = trackDots[trackDots.length - 1].getLatLng();
        if (lastDotLatLng.lat === uLat && lastDotLatLng.lng === uLng) {
          isDuplicate = true;
        }
      }

      if (!isDuplicate) {
        // 小さな赤いドットを地図上に配置
        const dot = L.circleMarker([uLat, uLng], {
          radius: 4,           // 点の大きさ（ドット）
          color: "red",        // 枠線の色
          fillColor: "red",   // 塗りつぶしの色
          fillOpacity: 0.6,    // 透明度
          stroke: false        // 枠線を消して滑らかな丸にする
        }).addTo(map);

        // あとで一括消去できるように配列に保存
        trackDots.push(dot);
      }
    },
    (err) => {
      console.error("位置の追跡に失敗しました:", err.message);
    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}

// === 🟡 一時中止 ===
function pauseTracking() {
  if (watchId === null) return;

  // GPSの監視のみを止める（打った点データ trackDots はそのまま残る）
  navigator.geolocation.clearWatch(watchId);
  watchId = null;

  alert("🟡 記録を一時中止しました。移動しても点は打たれません。");

  // ボタンの状態を戻す
  document.getElementById("startBtn").disabled = false;
  document.getElementById("pauseBtn").disabled = true;
}

// === ⚪ 軌跡リセット ===
function clearTracking() {
  if (confirm("これまでに記録した歩いた足跡（てんてん）をすべて消去しますか？")) {
    // 地図上からすべてのドットを削除
    trackDots.forEach(dot => {
      map.removeLayer(dot);
    });
    // 配列も空っぽにする
    trackDots = [];
