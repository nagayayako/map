<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スタンプラリー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet（地図ライブラリ） -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: 60vh; }
    #panel { padding: 10px; }
    button { font-size: 16px; padding: 8px 12px; cursor: pointer; }
    .stamp { font-size: 20px; margin-bottom: 10px; }
    
    /* ピンの色を変えるためのスタイル定義 */
    .pin-red { filter: hue-rotate(0deg); }
    .pin-green { filter: hue-rotate(140deg); }
  </style>
</head>

<body>

<h2 style="padding:10px;">スタンプ</h2>
<div id="map"></div>

<div id="panel">
  <button onclick="checkLocation()">📍 現在地をチェック</button>
  <p id="message" style="color: blue; font-weight: bold;"></p>
  <div id="stamps"></div>
  <button onclick="resetStamps()" style="margin-top: 20px;">🗑 スタンプ帳をリセット</button>
</div>

<script>
let currentLocationMarker = null;
let currentLat = null; // 最後に取得した現在地の緯度
let currentLng = null; // 最後に取得した現在地の経度
const markers = {};    // 各スポットのマーカーを管理する箱

// === 史跡データ ===
const spots = [
  {
    id: "gmstert",
    name: "取水口？",
    lat: 36.3953, 
    lng: 140.2665,
    radius: 30,
    info: "ここに取水口？"
  },{
    id: "ichikumon",
    name: "移築もん",
    lat: 36.3951, 
    lng: 140.26607,
    radius: 30,
    info: ""
  },{
    id: "castle1",
    name: "鍵の手",
    lat: 36.388916, 
    lng: 140.256164,
    radius: 30,
    info: "鍵の手？"
  },{
    id: "castle2",
    name: "鍵の手",
    lat: 36.388916, 
    lng: 140.256164,
    radius: 30,
    info: "鍵の手？"
  },{
    id: "castle3",
    name: "鍵の手",
    lat: 36.388916, 
    lng: 140.256164,
    radius: 30,
    info: "鍵の手？"
  },{
    id: "castle4",
    name: "鍵の手",
    lat: 36.388916, 
    lng: 140.256164,
    radius: 30,
    info: "鍵の手？"
  },{
    id: "castle5",
    name: "鍵の手",
    lat: 36.388916, 
    lng: 140.256164,
    radius: 30,
    info: "鍵の手？"
  },{
    id: "castle6",
    name: "鍵の手",
    lat: 36.388916, 
    lng: 140.256164,
    radius: 30,
    info: "鍵の手？"
  },

  {
    id: "traficright1",
    name: "交差点",
    lat: 36.3770,
    lng: 140.2783,
    radius: 30,
    info: "ここは交差点です。"
  },
  {
    id: "traficright2",
    name: "交差点",
    lat: 36.3770,
    lng: 140.2783,
    radius: 30,
    info: "ここは交差点です。"
  },
  {
    id: "mitotullys",
    name: "タリーズ",
    lat: 36.37115,
    lng: 140.47631,
    radius: 30,
    info: "ここはタリーズです。"
  },
  {
    id: "pkg",
    name: "駐車場",
    lat: 36.370026,
    lng: 140.4778904,
    radius: 50000,
    info: "ここは駐車場です。"
  }
];

// === 地図表示 ===
const map = L.map("map").setView([36.3824, 140.2674], 15);

// 1. 通常地図（OpenStreetMap）レイヤー
const baseMap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
  // ※背景として独立させるため、opacity（透明度）の設定は削除して100%ではっきり表示させます
});

// 2. 航空写真（国土地理院）レイヤー
const satelliteMap = L.tileLayer("https://gsi.go.jp{z}/{x}/{y}.jpg", {
  attribution: "© 国土地理院"
});

// 3. オリジナルマップ（meijiline.png）を「背景グループ」として作成
// ※Leafletの仕様上、画像を背景にする場合は「空のレイヤー」を作ってそこに画像を載せます
const originalMapGroup = L.layerGroup();

const imageBounds = [
  [36.376273, 140.246029], //左下
  [36.396837, 140.278823]  //右上
];
const imageUrl = "meijiline.png"; 

L.imageOverlay(imageUrl, imageBounds, {
  opacity: 1.0,     // 背景として使うので、透けさせずに100%ではっきり表示
  alt: "オリジナルマップ"
}).addTo(originalMapGroup);


// === 4. 最初は「オリジナルマップ」を画面に表示しておく ===
originalMapGroup.addTo(map);


// === 5. 右上の切り替えボタンに3つの選択肢を登録 ===
const baseLayers = {
  "オリジナル地図": originalMapGroup,
  "元の地図": baseMap,
  "航空写真": satelliteMap
};

// ラジオボタンでどれか1つだけが選ばれるようになります
L.control.layers(baseLayers, null, { position: 'topright' }).addTo(map);




  
// マーカーの見た目を更新・初期配置する関数
function updateMapMarkers() {
  spots.forEach(s => {
    const got = localStorage.getItem("stamp_" + s.id);
    // 獲得済なら緑（pin-green）、未獲得なら赤（pin-red）
    const pinClass = got ? "pin-green" : "pin-red";

    if (markers[s.id]) {
      // 既にピンがある場合は、色（クラス名）だけ変更
      L.DomUtil.removeClass(markers[s.id]._icon, "pin-red");
      L.DomUtil.removeClass(markers[s.id]._icon, "pin-green");
      L.DomUtil.addClass(markers[s.id]._icon, pinClass);
    } else {
      // 最初は新しくピンを作る
      markers[s.id] = L.marker([s.lat, s.lng]).addTo(map).bindPopup(`<b>${s.name}</b><br>${s.info}`);
      // 作成直後にクラスを付与
      L.DomUtil.addClass(markers[s.id]._icon, pinClass);
    }
  });
}

// === 距離計算 ===
function isNear(lat1, lng1, lat2, lng2, radius) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLng / 2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c < radius;
}

// === 📍 現在地をチェック（位置表示のみに変更） ===
function checkLocation() {
  alert("📍 現在地チェック開始");

  if (!navigator.geolocation) {
    alert("このブラウザは位置情報に対応していません");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      // 取得した緯度経度を記憶する
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;

      alert("位置取得成功！"); 

      if (currentLocationMarker) {
        map.removeLayer(currentLocationMarker);
      }
      
      currentLocationMarker = L.circleMarker(
        [currentLat, currentLng],
        {
          radius: 8,
          color: "blue",
          fillColor: "blue",
          fillOpacity: 0.8
        }
      ).addTo(map);
      
      map.setView([currentLat, currentLng], 16);
      
      // 案内メッセージを変更（自動スタンプは無し）
      document.getElementById("message").textContent = "📍 現在地を更新しました！下のスタンプ帳からボタンを押してね。";
    },
    err => {
      alert("位置情報が取得できませんでした。\n理由: " + err.message);
    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}

// === 個別のスタンプ判定機能（追加） ===
function tryGetStamp(id) {
  // まだ現在地がチェックされていない場合
  if (currentLat === null || currentLng === null) {
    alert("まずは「📍 現在地をチェック」ボタンを押して、マップ上に現在地を表示させてください！");
    return;
  }

  // 対象のスポットデータを特定
  const s = spots.find(spot => spot.id === id);
  
  // 現在地とスポットの距離を判定
  if (isNear(currentLat, currentLng, s.lat, s.lng, s.radius)) {
    localStorage.setItem("stamp_" + s.id, "true");
    alert("🎉 スタンプGET！：" + s.name);
    
    updateMapMarkers(); // マーカーの色を緑に変える
    showStamps();       // スタンプ帳のボタンを「獲得済」に変える
  } else {
    alert("🥲 残念！まだ「" + s.name + "」の近くにいません。もっと近づいてからもう一度押してね。");
  }
}

// === スタンプ表示（個別ボタン付きに改造） ===
function showStamps() {
  const div = document.getElementById("stamps");
  div.innerHTML = "<h3>📖 スタンプ帳</h3>";

  spots.forEach(s => {
    const got = localStorage.getItem("stamp_" + s.id);
    
    if (got) {
      div.innerHTML += `<div class="stamp">${s.name}：✅ 獲得済</div>`;
    } else {
      // 未獲得の場合は、個別の判定ボタンを配置
      div.innerHTML += `
        <div class="stamp">
          ${s.name}：❌ 
          <button onclick="tryGetStamp('${s.id}')" style="font-size:14px; padding:4px 8px; margin-left:10px;">ここでスタンプを押す</button>
        </div>`;
    }
  });
}
//🍎リセット機能
function resetStamps() {
  if (confirm("スタンプをすべて消しますか？")) {
    spots.forEach(s => {
      localStorage.removeItem("stamp_" + s.id);
    });
    updateMapMarkers(); // ピンの色をすべて赤に戻す
    showStamps();       // スタンプ帳をリセット
    document.getElementById("message").textContent = "";
  }
}

// 初期起動時の実行
updateMapMarkers();
showStamps();
</script>

</body>
</html>
