<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スタンプラリー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet（地図ライブラリ） -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: 60vh; }
    #panel { padding: 10px; }
    button { font-size: 16px; padding: 8px 12px; cursor: pointer; }
    .stamp { font-size: 20px; margin-bottom: 10px; }
    
    /* ピンの色を変えるためのスタイル定義 */
    .pin-red { filter: hue-rotate(0deg); }
    .pin-green { filter: hue-rotate(140deg); }
  </style>
</head>

<body>

<h2 style="padding:10px;">スタンプ</h2>
<div id="map"></div>


<div id="panel">
  <!-- 📍ボタンの横あたりに追加してください -->
  <button id="startBtn" onclick="startTracking()" style="background-color: #ccffcc;">🏁 スタンプラリー開始</button>
  <button id="stopBtn" onclick="stopTracking()" style="background-color: #ffcccc;" disabled>🎯 ゴール！</button>
  
  <button onclick="checkLocation()">📍 現在地をチェック</button>
  <p id="message" style="color: blue; font-weight: bold;"></p>
  <div id="stamps"></div>
  <button onclick="resetStamps()" style="margin-top: 20px; background-color: #ffcccc;">🗑 スタンプ帳をリセット</button>
</div>

  
<script>
let currentLocationMarker = null;
let currentLat = null; // 最後に取得した現在地の緯度
let currentLng = null; // 最後に取得した現在地の経度
const markers = {};    // 各スポットのマーカーを管理する箱

// === 史跡データ ===
const spots = [
  {
    id: "gmstert",
    name: "取水口？",
    lat: 36.3953, 
    lng: 140.2665,
    radius: 30,
    info: "ここに取水口？"
  },{
    id: "ichikumon",
    name: "移築もん",
    lat: 36.3951, 
    lng: 140.26607,
    radius: 30,
    info: ""
  },{
    id: "castle1",
    name: "鍵の手",
    lat: 36.388916, 
    lng: 140.256164,
    radius: 30,
    info: "鍵の手？"
  },{
    id: "castle2",
    name: "鍵の手",
    lat: 36.388916, 
    lng: 140.256164,
    radius: 30,
    info: "鍵の手？"
  },{
    id: "castle3",
    name: "鍵の手",
    lat: 36.388916, 
    lng: 140.256164,
    radius: 30,
    info: "鍵の手？"
  },{
    id: "castle4",
    name: "鍵の手",
    lat: 36.388916, 
    lng: 140.256164,
    radius: 30,
    info: "鍵の手？"
  },{
    id: "castle5",
    name: "鍵の手",
    lat: 36.388916, 
    lng: 140.256164,
    radius: 30,
    info: "鍵の手？"
  },{
    id: "castle6",
    name: "鍵の手",
    lat: 36.388916, 
    lng: 140.256164,
    radius: 30,
    info: "鍵の手？"
  },

  {
    id: "traficright1",
    name: "交差点",
    lat: 36.3770,
    lng: 140.2783,
    radius: 30,
    info: "ここは交差点です。"
  },
  {
    id: "traficright2",
    name: "交差点",
    lat: 36.3770,
    lng: 140.2783,
    radius: 30,
    info: "ここは交差点です。"
  },
  {
    id: "mitotullys",
    name: "タリーズ",
    lat: 36.37115,
    lng: 140.47631,
    radius: 30,
    info: "ここはタリーズです。"
  },
  {
    id: "pkg",
    name: "駐車場",
    lat: 36.370026,
    lng: 140.4778904,
    radius: 50000,
    info: "ここは駐車場です。"
  },
  {
    id: "11",
    name: "大黒石",
    lat: 36.38601,
    lng: 140.26557,
    radius: 50000,
    info: "徳蔵寺に攻められた時に、正福寺がおっことして攻撃した石。大黒様の石と袋の石があって、今残っているのは袋の石。"
  }




];

// === 地図表示 ===
// ズームレベルを「15」から、確実に航空写真が表示される「16」（より拡大された状態）に変更します
const map = L.map("map").setView([36.3824, 140.2674], 16);

// 1. 通常地図（OpenStreetMap）レイヤー
const baseMap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap",
  maxZoom: 19
});

// 2. 航空写真（国土地理院）レイヤー
// maxNativeZoomを指定することで、これ以上ズームアウト・ズームインしても画像が消えないように保護します
const satelliteMap = L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg", {
  attribution: "© 国土地理院",
  minZoom: 2,
  maxZoom: 19,
  maxNativeZoom: 18
});

// 3. オリジナルマップ（meijiline.png）を「背景グループ」として作成
const originalMapGroup = L.layerGroup();

const imageBounds = [
  [36.376273, 140.246029], //左下
  [36.396837, 140.278823]  //右上
];
const imageUrl = "meijiline.png"; 

L.imageOverlay(imageUrl, imageBounds, {
  opacity: 1.0,     
  alt: "オリジナルマップ"
}).addTo(originalMapGroup);


// === 4. 最初は「オリジナルマップ」を画面に表示しておく ===
originalMapGroup.addTo(map);


// === 5. 右上の切り替えボタンに3つの選択肢を登録 ===
const baseLayers = {
  "オリジナル地図": originalMapGroup,
  "元の地図": baseMap,
  "航空写真": satelliteMap
};

L.control.layers(baseLayers, null, { position: 'topright' }).addTo(map);

  
// マーカーの見た目を更新・初期配置する関数
function updateMapMarkers() {
  spots.forEach(s => {
    const got = localStorage.getItem("stamp_" + s.id);
    // 獲得済なら緑（pin-green）、未獲得なら赤（pin-red）
    const pinClass = got ? "pin-green" : "pin-red";

    // 吹き出し（ポップアップ）の中身を動的に作成
    let popupContent = `<b>${s.name}</b><br>${s.info}`;
    if (got) {
      popupContent += `<br><span style="color:green; font-weight:bold;">✅ スタンプ獲得済</span>`;
    } else {
      // 未獲得の場合、吹き出し内にも「ここでスタンプを押す」ボタンを設置
      popupContent += `<br><button onclick="tryGetStamp('${s.id}')" style="font-size:12px; padding:3px 6px; margin-top:5px; cursor:pointer;">ここでスタンプを押す</button>`;
    }

    if (markers[s.id]) {
      // 既にピンがある場合は、色（クラス名）の変更とポップアップ内容の更新
      L.DomUtil.removeClass(markers[s.id]._icon, "pin-red");
      L.DomUtil.removeClass(markers[s.id]._icon, "pin-green");
      L.DomUtil.addClass(markers[s.id]._icon, pinClass);
      
      // ポップアップが開いている場合は一度閉じて中身を更新
      markers[s.id].setPopupContent(popupContent);
    } else {
      // 最初は新しくピンを作る
      markers[s.id] = L.marker([s.lat, s.lng]).addTo(map).bindPopup(popupContent);
      // 作成直後にクラスを付与
      L.DomUtil.addClass(markers[s.id]._icon, pinClass);
    }
  });
}

// === 距離計算 ===
function isNear(lat1, lng1, lat2, lng2, radius) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLng / 2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c < radius;
}

// === 📍 現在地をチェック（位置表示のみに変更） ===
function checkLocation() {
  alert("📍 現在地チェック開始");

  if (!navigator.geolocation) {
    alert("このブラウザは位置情報に対応していません");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      // 取得した緯度経度を記憶する
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;

      alert("位置取得成功！"); 

      if (currentLocationMarker) {
        map.removeLayer(currentLocationMarker);
      }
      
      currentLocationMarker = L.circleMarker(
        [currentLat, currentLng],
        {
          radius: 8,
          color: "blue",
          fillColor: "blue",
          fillOpacity: 0.8
        }
      ).addTo(map);
      
      map.setView([currentLat, currentLng], 16);
      
      // 案内メッセージを変更（自動スタンプは無し）
      document.getElementById("message").textContent = "📍 現在地を更新しました！下のスタンプ帳からボタンを押してね。";
    },
    err => {
      alert("位置情報が取得できませんでした。\n理由: " + err.message);
    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}

// === 個別のスタンプ判定機能（追加） ===
function tryGetStamp(id) {
  // まだ現在地がチェックされていない場合
  if (currentLat === null || currentLng === null) {
    alert("まずは「📍 現在地をチェック」ボタンを押して、マップ上に現在地を表示させてください！");
    return;
  }

  // 対象のスポットデータを特定
  const s = spots.find(spot => spot.id === id);
  
  // 現在地とスポットの距離を判定
  if (isNear(currentLat, currentLng, s.lat, s.lng, s.radius)) {
    localStorage.setItem("stamp_" + s.id, "true");
    alert("🎉 スタンプGET！：" + s.name);
    
    updateMapMarkers(); // マーカーの色を緑に変える
    showStamps();       // スタンプ帳のボタンを「獲得済」に変える
  } else {
    alert("🥲 残念！まだ「" + s.name + "」の近くにいません。もっと近づいてからもう一度押してね。");
  }
}

// === スタンプ表示（個別ボタン付きに改造） ===
function showStamps() {
  const div = document.getElementById("stamps");
  div.innerHTML = "<h3>📖 スタンプ帳</h3>";

  spots.forEach(s => {
    const got = localStorage.getItem("stamp_" + s.id);
    
    if (got) {
      div.innerHTML += `<div class="stamp">${s.name}：✅ 獲得済</div>`;
    } else {
      // 未獲得の場合は、個別の判定ボタンを配置
      div.innerHTML += `
        <div class="stamp">
          ${s.name}：❌ 
          <button onclick="tryGetStamp('${s.id}')" style="font-size:14px; padding:4px 8px; margin-left:10px;">ここでスタンプを押す</button>
        </div>`;
    }
  });
}
//🍎リセット機能
function resetStamps() {
  if (confirm("スタンプをすべて消しますか？")) {
    spots.forEach(s => {
      localStorage.removeItem("stamp_" + s.id);
    });
    updateMapMarkers(); // ピンの色をすべて赤に戻す
    showStamps();       // スタンプ帳をリセット
    document.getElementById("message").textContent = "";
  }
}


////////////軌跡ここから
// === 軌跡（ルート記録）機能の変数 ===
let watchId = null;          // GPSの継続監視を管理するID
let routePath = [];         // 歩いた緯度経度のリストを保存する箱
let routeLine = null;       // 地図上に引く線のオブジェクト

// === 🏁 スタンプラリー開始（追跡スタート） ===
function startTracking() {
  if (!navigator.geolocation) {
    alert("お使いのブラウザは位置情報の追跡に対応していません");
    return;
  }

  if (watchId !== null) return; // 既に開始していれば何もしない

  alert("🏁 記録を開始しました！歩くと地図に軌跡が描かれます。");
  
  // ボタンの有効・無効を切り替え
  document.getElementById("startBtn").disabled = true;
  document.getElementById("stopBtn").disabled = false;

  // 軌跡データを初期化し、古い線があれば地図から消す
  routePath = [];
  if (routeLine) {
    map.removeLayer(routeLine);
  }

  // watchPositionを使って、移動を自動で検知し続ける
  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const uLat = pos.coords.latitude;
      const uLng = pos.coords.longitude;

      // 最新の現在地を記録
      currentLat = uLat;
      currentLng = uLng;

      // 1つ前の位置と同じでなければ、軌跡リスト（配列）に緯度経度を追加
      const lastPoint = routePath[routePath.length - 1];
      if (!lastPoint || lastPoint[0] !== uLat || lastPoint[1] !== uLng) {
        routePath.push([uLat, uLng]);
      }

      // 地図上に引く線の設定（すでに線があれば更新、なければ新しく作る）
      if (routeLine) {
        routeLine.setLatLngs(routePath);
      } else {
        routeLine = L.polyline(routePath, {
          color: "red",       // 線の色（赤）
          weight: 5,         // 線の太さ
          opacity: 0.8,       // 線の透明度
          dashArray: "5, 10"  // 点線にしたい場合は指定（実線ならこの行を消す）
        }).addTo(map);
      }

      // 現在地マーク（青丸）も自動で移動させる
      if (currentLocationMarker) {
        currentLocationMarker.setLatLng([uLat, uLng]);
      } else {
        currentLocationMarker = L.circleMarker([uLat, uLng], {
          radius: 8, color: "blue", fillColor: "blue", fillOpacity: 0.8
        }).addTo(map);
      }
    },
    (err) => {
      console.error("位置の追跡に失敗しました:", err.message);
    },
    {
      enableHighAccuracy: true, // 高精度GPSを使用
      timeout: 10000,
      maximumAge: 0
    }
  );
}

// === 🎯 ゴール（追跡ストップ） ===
function stopTracking() {
  if (watchId === null) return;

  // GPSの監視をストップする
  navigator.geolocation.clearWatch(watchId);
  watchId = null;

  alert("🎯 ゴール！お疲れ様でした。歩いたルートが地図に残ります。");

  // ボタンの状態を元に戻す
  document.getElementById("startBtn").disabled = false;
  document.getElementById("stopBtn").disabled = true;
}
////////////軌跡ここまで




  
// 初期起動時の実行
updateMapMarkers();
showStamps();
</script>

</body>
</html>
