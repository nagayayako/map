<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スタンプラリー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet（地図ライブラリ） -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: 60vh; }
    #panel { padding: 10px; }
    button { font-size: 16px; padding: 8px 12px; cursor: pointer; }
    .stamp { font-size: 20px; margin-bottom: 10px; }
    
    /* ピンの色を変えるためのスタイル定義 */
    .pin-red { filter: hue-rotate(0deg); }
    .pin-green { filter: hue-rotate(140deg); }
    .pin-yellow { filter: hue-rotate(50deg); } /* 👈 黄色用の色フィルターをここに追記 */

    /* 自作四角パネルの共通スタイル */
    .custom-map-control {
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      font-family: sans-serif;
      font-size: 13px;
      color: #333;
      margin-top: 10px !important; /* 👈 ここにこの1行を付け足してください */
    }
    
    /* 最小化（閉じている時）の見た目（34px四方の正方形） */
    .custom-map-control.collapsed {
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .custom-map-control.collapsed .control-icon {
      font-size: 16px;
      display: block;
    }
    .custom-map-control.expanded .control-icon {
      display: none;
    }
    
    /* 展開している（開いている時）の見た目 */
    .custom-map-control.expanded {
      width: auto;
      height: auto;
      padding: 8px 10px;
    }
    .custom-map-control h4 {
      margin: 0 0 6px 0;
      font-size: 12px;
      color: #666;
      border-bottom: 1px solid #eee;
      padding-bottom: 3px;
      white-space: nowrap;
    }
    .custom-map-control label {
      display: block;
      margin: 6px 0;
      cursor: pointer;
      white-space: nowrap;
    }
    .custom-map-control input {
      margin-right: 5px;
      vertical-align: middle;
    }
    .custom-map-control .control-content {
      display: none;
    }
    .custom-map-control.expanded .control-content {
      display: block;
    }

  </style>
</head>

<body>

<h2 style="padding:10px;">スタンプ</h2>
<div id="map"></div>


<div id="panel">
  <!-- 📍ボタンの横あたりに追加してください -->
  
  <button onclick="checkLocation()">📍 現在地をチェック</button>
  <p id="message" style="color: blue; font-weight: bold;"></p>
  <div id="stamps"></div>
  <button onclick="resetStamps()" style="margin-top: 20px; background-color: #ffcccc;">🗑 スタンプ帳をリセット</button>
</div>

  
<script>
let currentLocationMarker = null;
let currentLat = null; // 最後に取得した現在地の緯度
let currentLng = null; // 最後に取得した現在地の経度
const markers = {};    // 各スポットのマーカーを管理する箱

// === 史跡データ ===
const spots = [
  {
    id: "gmstert",
    name: "取水口？",
    lat: 36.3953,

    radius: 30,

  },{

  },{

    info: "鍵の手？"
  },{
    id: "castle2",
    name: "鍵の手",
    lat: 36.388916, 
    lng: 140.256164,
    radius: 30,
    info: "鍵の手？"
  },{
    id: "castle3",
    name: "鍵の手",
    lat: 36.388916, 
    lng: 140.256164,
    radius: 30,
    info: "鍵の手？"
  },{
    id: "castle4",
    name: "鍵の手",
    lat: 36.388916, 
    lng: 140.256164,
    radius: 30,
    info: "鍵の手？"
  },{
    id: "castle5",
    name: "鍵の手",
    lat: 36.388916, 
    lng: 140.256164,
    radius: 30,
    info: "鍵の手？"
  },{
    id: "castle6",
    name: "鍵の手",
    lat: 36.388916, 
    lng: 140.256164,
    radius: 30,
    info: "鍵の手？"
  },

  {
    id: "traficright1",
    name: "交差点",
    lat: 36.3770,
    lng: 140.2783,
    radius: 30,
    info: "ここは交差点です。"
  },
  {
    id: "traficright2",
    name: "交差点",
    lat: 36.3770,
    lng: 140.2783,
    radius: 30,
    info: "ここは交差点です。"
  },
  {
    id: "mitotullys",
    name: "タリーズ",
    lat: 36.37115,
    lng: 140.47631,
    radius: 30,
    info: "ここはタリーズです。"
  },
  {
    id: "pkg",
    name: "駐車場",
    lat: 36.370026,
    lng: 140.4778904,
    radius: 50000,
    info: "ここは駐車場です。"
  },
  {
    id: "11",
    name: "大黒石",
    lat: 36.38601,
    lng: 140.26557,
    radius: 50000,
    info: "徳蔵寺に攻められた時に、正福寺がおっことして攻撃した石。大黒様の石と袋の石があって、今残っているのは袋の石。"
  }




];

// === 地図表示 ===
// ズームレベルを「15」から、確実に航空写真が表示される「16」（より拡大された状態）に変更します
const map = L.map("map").setView([36.3824, 140.2674], 16);

// 1. 通常地図（OpenStreetMap）レイヤー
const baseMap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap",
  maxZoom: 19
});

// 2. 航空写真（国土地理院）レイヤー
// maxNativeZoomを指定することで、これ以上ズームアウト・ズームインしても画像が消えないように保護します
const satelliteMap = L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg", {
  attribution: "© 国土地理院",
  minZoom: 2,
  maxZoom: 19,
  maxNativeZoom: 18
});

// 3. オリジナルマップ（meijiline.png）を「背景グループ」として作成
const originalMapGroup = L.layerGroup();

const imageBounds = [
  [36.376273, 140.246029], //左下
  [36.396837, 140.278823]  //右上
];
const imageUrl = "meijiline.png"; 

L.imageOverlay(imageUrl, imageBounds, {
  opacity: 1.0,     
  alt: "オリジナルマップ"
}).addTo(originalMapGroup);


// === 4. 最初は「オリジナルマップ」を画面に表示しておく ===
originalMapGroup.addTo(map);


// === 5. 右上の切り替えボタンに3つの選択肢を登録 ===
// === 🆕 ① スマホでも絶対に誤作動しない「四角パネル自動開閉システム」 ===
function setupControlToggle(container) {
  // 最初は「最小化（collapsed）」状態にする
  container.classList.add('custom-map-control', 'collapsed');

  // アイコンをタップ、またはマウスが乗ったら「開く」
  const expand = () => {
    container.classList.remove('collapsed');
    container.classList.add('expanded');
  };
  container.addEventListener('mouseenter', expand);
  container.addEventListener('touchstart', expand, { passive: true });

  // マウスが完全に離れたら折りたたむ（最小化）
  container.addEventListener('mouseleave', () => {
    container.classList.remove('expanded');
    container.classList.add('collapsed');
  });

  // ラジオボタンをクリックした時は、タッチのズレを防ぐため「0.3秒待ってから」閉じる
  container.addEventListener('change', () => {
    setTimeout(() => {
      container.classList.remove('expanded');
      container.classList.add('collapsed');
    }, 300);
  });

  // 地図画面をタップしたら折りたたむ
  map.on('click', () => {
    container.classList.remove('expanded');
    container.classList.add('collapsed');
  });

  // パネル内を触ったときに後ろの地図が勝手に動くのを防ぐ
  L.DomEvent.disableClickPropagation(container);
}

// === 🆕 ② 自作「地図切り替え四角パネル」 ===
const CustomLayersControl = L.Control.extend({
  options: { position: 'topright' },
  onAdd: function () {
    const container = L.DomUtil.create('div');
    container.innerHTML = `
      <div class="control-icon">🗺</div>
      <div class="control-content">
        <h4>地図の切り替え</h4>
        <label><input type="radio" name="layer_opt" checked onclick="handleLayerRadio('original')">オリジナル地図</label>
        <label><input type="radio" name="layer_opt" onclick="handleLayerRadio('base')">元の地図</label>
        <label><input type="radio" name="layer_opt" onclick="handleLayerRadio('satellite')">航空写真</label>
      </div>
    `;
    setupControlToggle(container);
    return container;
  }
});
map.addControl(new CustomLayersControl());

// 🆕 ③ 地図切り替えの実際の処理
function handleLayerRadio(type) {
  map.removeLayer(originalMapGroup);
  map.removeLayer(baseMap);
  map.removeLayer(satelliteMap);

  if (type === 'original') originalMapGroup.addTo(map);
  if (type === 'base') baseMap.addTo(map);
  if (type === 'satellite') satelliteMap.addTo(map);
}

// === 🆕 ④ 自作「足跡の記録四角パネル」を追加 ===
const CustomTrackControl = L.Control.extend({
  options: { position: 'topright' }, // 「🗺」の下に自動で並びます
  onAdd: function () {
    const container = L.DomUtil.create('div');
    container.innerHTML = `
      <div class="control-icon" id="track-icon-status">👣</div>
      <div class="control-content">
        <h4>足跡の記録</h4>
        <label><input type="radio" name="track_opt" id="opt_start" onclick="handleTrackRadio('start')">🟢 足跡スタート</label>
        <label><input type="radio" name="track_opt" id="opt_pause" onclick="handleTrackRadio('pause')">🟡 足跡ひとやすみ</label>
        <label><input type="radio" name="track_opt" id="opt_stop" checked onclick="handleTrackRadio('stop')">⚪ 足跡リセット</label>
      </div>
    `;
    setupControlToggle(container); // 先ほど作った開閉の仕組みをそのまま使い回します
    return container;
  }
});
map.addControl(new CustomTrackControl());

// 🆕 ⑤ ボタンが押されたときに「とりあえずメッセージを出す」だけの仮の関数
// === 🆕 ⑥ 本物の足跡切り替え ＆ メッセージ連動システム ===
let watchId = null;          // GPSの継続監視を管理するID
let trackDots = [];          // 地図上に打った「てんてん」のマークを保存する箱
let lastDotTime = 0;         // 最後にドットを打った時刻（ミリ秒）

function handleTrackRadio(mode) {
  const iconStatus = document.getElementById('track-icon-status');
  const messageEl = document.getElementById('message');

  if (mode === 'start') {
    startTracking(); // 🟢 GPS追跡スタート
    if (iconStatus) iconStatus.innerText = "🟢"; 
    if (messageEl) messageEl.textContent = "🟢 足跡の記録を開始しました！30秒ごとに点を打ちます。";
  } 
  
  else if (mode === 'pause') {
    pauseTracking(); // 🟡 GPS追跡を一時停止（ドットデータは残る）
    if (iconStatus) iconStatus.innerText = "🟡"; 
    if (messageEl) messageEl.textContent = "🟡 足跡の記録をひとやすみしています。";
  } 
  
  else if (mode === 'stop') {
    // ⚪ リセットが選ばれたとき
    if (trackDots.length > 0) {
      if (confirm("これまでに記録した歩いた足跡（てんてん）をすべて消去しますか？")) {
        // ユーザーがOKを押したら全消去してGPSを完全停止
        trackDots.forEach(dot => map.removeLayer(dot));
        trackDots = [];
        lastDotTime = 0;
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
        if (iconStatus) iconStatus.innerText = "👣"; 
        if (messageEl) messageEl.textContent = "⚪ 足跡をリセットしました。";
        alert("⚪ 軌跡をリセットしました。");
      } else {
        // キャンセルされたら、ラジオボタンのチェックを直前の状態（開始か一時停止）に自動で弾き戻す
        if (watchId !== null) {
          document.getElementById('opt_start').checked = true;
          if (iconStatus) iconStatus.innerText = "🟢";
        } else {
          document.getElementById('opt_pause').checked = true;
          if (iconStatus) iconStatus.innerText = "🟡";
        }
      }
    } else {
      // 最初からデータがない場合は、そのままGPS監視を止めるだけ
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      if (iconStatus) iconStatus.innerText = "👣"; 
      if (messageEl) messageEl.textContent = "⚪ 記録は停止しています。";
    }
  }
}

// === 🟢 足跡スタート（再開・エラー復旧対応） ===
function startTracking() {
  if (!navigator.geolocation) {
    alert("お使いのブラウザは位置情報の追跡に対応していません");
    document.getElementById('opt_stop').checked = true; 
    document.getElementById('track-icon-status').innerText = "👣";
    return;
  }
  if (watchId !== null) return; // 既に動いていれば何もしない（「ひとやすみ」からの再開を可能にする）

  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const uLat = pos.coords.latitude;
      const uLng = pos.coords.longitude;
      currentLat = uLat;
      currentLng = uLng;

      // 現在地マーク（青丸）を自動移動
      if (currentLocationMarker) {
        currentLocationMarker.setLatLng([uLat, uLng]);
      } else {
        currentLocationMarker = L.circleMarker([uLat, uLng], {
          radius: 8, color: "blue", fillColor: "blue", fillOpacity: 0.8
        }).addTo(map);
      }

      // 【30秒おきのドット記録システム】
      const now = Date.now();
      if (lastDotTime === 0 || (now - lastDotTime) >= 30000) {
        const dot = L.circleMarker([uLat, uLng], {
          radius: 4, color: "red", fillColor: "red", fillOpacity: 0.6, stroke: false
        }).addTo(map);
        trackDots.push(dot);
        lastDotTime = now;
      }
    },
    (err) => {
      console.error("位置の追跡に失敗しました:", err.message);
      alert("⚠️ GPS信号が弱いため記録を開始できません。");
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      document.getElementById('opt_stop').checked = true;
      document.getElementById('track-icon-status').innerText = "👣";
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

// === 🟡 足跡ひとやすみ ===
function pauseTracking() {
  if (watchId === null) return;
  // GPSの電波キャッチ（監視）だけを遮断する。これまでのドット配列や時間はそのまま維持されます
  navigator.geolocation.clearWatch(watchId);
  watchId = null;
}

  
  
  
// マーカーの見た目を更新・初期配置する関数（吹き出し内に「行きたいボタン」を追加）
function updateMapMarkers() {
  spots.forEach(s => {
    const got = localStorage.getItem("stamp_" + s.id);      // 獲得済（緑）
    const wish = localStorage.getItem("wish_" + s.id);      // 行きたい（黄）

    // 1. 状態に応じたピンのクラスを決定
    let pinClass = "pin-red"; // デフォルトは赤
    if (got) {
      pinClass = "pin-green";
    } else if (wish) {
      pinClass = "pin-yellow";
    }

    // 2. 吹き出し（ポップアップ）の中身を作成
    let popupContent = `<div style="text-align: center; font-family: sans-serif; min-width: 160px;">`;
    if (got) {
      // 【獲得済】
      popupContent += `
        <img src="https://icons8.com" alt="スタンプ" style="width: 50px; height: 50px; object-fit: contain; margin-bottom: 5px;">
        <br><b style="font-size: 14px;">${s.name}</b><br>
        <span style="font-size: 12px; color: #666;">${s.info}</span><br>
        <span style="color: green; font-weight: bold; font-size: 13px; display: inline-block; margin-top: 5px;">✅ 獲得済</span>`;
    } else {
      // 【未獲得】ボタンをコンパクトに横並び
      // 黄色状態なら「📍外す」、赤色状態なら「📍行きたい」に文字が変わります
      const wishButtonText = wish ? "📍外す" : "📍行きたい";
      const wishButtonColor = wish ? "#fff0f0" : "#fffde6"; // 状態に合わせてボタンの背景色も変化

      popupContent += `
        <img src="https://icons8.com" alt="スタンプ" style="width: 50px; height: 50px; object-fit: contain; margin-bottom: 5px; opacity: 0.2; filter: grayscale(100%);">
        <br><b style="font-size: 14px;">${s.name}</b><br>
        <span style="font-size: 12px; color: #666;">${s.info}</span><br>
        
        <div style="margin-top: 8px; display: flex; justify-content: center; gap: 5px;">
          <button onclick="tryGetStamp('${s.id}')" style="font-size: 11px; padding: 4px 6px; cursor: pointer; background-color: #fff; border: 1px solid #ccc; border-radius: 4px;">
            押す
          </button>
          <button onclick="toggleWish('${s.id}')" style="font-size: 11px; padding: 4px 6px; cursor: pointer; background-color: ${wishButtonColor}; border: 1px solid #ccc; border-radius: 4px;">
            ${wishButtonText}
          </button>
        </div>`;
    }
    popupContent += `</div>`;

    // 3. マーカーの配置または更新
    if (markers[s.id]) {
      // すべての色クラスを一度外してから、正しいクラスを付け直す
      L.DomUtil.removeClass(markers[s.id]._icon, "pin-red");
      L.DomUtil.removeClass(markers[s.id]._icon, "pin-green");
      L.DomUtil.removeClass(markers[s.id]._icon, "pin-yellow");
      L.DomUtil.addClass(markers[s.id]._icon, pinClass);
      
      // ポップアップが開いたままでも中身が切り替わるように更新
      markers[s.id].setPopupContent(popupContent);
    } else {
      const marker = L.marker([s.lat, s.lng]).addTo(map).bindPopup(popupContent);
      L.DomUtil.addClass(marker._icon, pinClass);
      markers[s.id] = marker;
    }
  });
}




// === 🆕 「行きたい」ボタンが押された時のオンオフ処理 ===
function toggleWish(id) {
  const wish = localStorage.getItem("wish_" + id);
  if (wish) {
    localStorage.removeItem("wish_" + id); // すでに登録されていれば解除（赤に戻す）
  } else {
    localStorage.setItem("wish_" + id, "true"); // なければ登録（黄色にする）
  }
  updateMapMarkers(); // 地図のピンの色と、吹き出し内のボタン表示を即座に更新
}


  

// === 距離計算 ===
function isNear(lat1, lng1, lat2, lng2, radius) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLng / 2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c < radius;
}

// === 📍 現在地をチェック（位置表示のみに変更） ===
function checkLocation() {
  alert("📍 現在地チェック開始");

  if (!navigator.geolocation) {
    alert("このブラウザは位置情報に対応していません");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      // 取得した緯度経度を記憶する
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;

      alert("位置取得成功！"); 

      if (currentLocationMarker) {
        map.removeLayer(currentLocationMarker);
      }
      
      currentLocationMarker = L.circleMarker(
        [currentLat, currentLng],
        {
          radius: 8,
          color: "blue",
          fillColor: "blue",
          fillOpacity: 0.8
        }
      ).addTo(map);
      
      map.setView([currentLat, currentLng], 16);
      
      // 案内メッセージを変更（自動スタンプは無し）
      document.getElementById("message").textContent = "📍 現在地を更新しました！下のスタンプ帳からボタンを押してね。";
    },
    err => {
      alert("位置情報が取得できませんでした。\n理由: " + err.message);
    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}

// === 個別のスタンプ判定機能（追加） ===
function tryGetStamp(id) {
  // まだ現在地がチェックされていない場合
  if (currentLat === null || currentLng === null) {
    alert("まずは「📍 現在地をチェック」ボタンを押して、マップ上に現在地を表示させてください！");
    return;
  }

  // 対象のスポットデータを特定
  const s = spots.find(spot => spot.id === id);
  
  // 現在地とスポットの距離を判定
  if (isNear(currentLat, currentLng, s.lat, s.lng, s.radius)) {
    localStorage.setItem("stamp_" + s.id, "true");
    alert("🎉 スタンプGET！：" + s.name);
    
    updateMapMarkers(); // マーカーの色を緑に変える
    showStamps();       // スタンプ帳のボタンを「獲得済」に変える
  } else {
    alert("🥲 残念！まだ「" + s.name + "」の近くにいません。もっと近づいてからもう一度押してね。");
  }
}

// === スタンプ表示（個別ボタン付きに改造） ===
function showStamps() {
  const div = document.getElementById("stamps");
  div.innerHTML = "<h3>📖 スタンプ帳</h3>";

  spots.forEach(s => {
    const got = localStorage.getItem("stamp_" + s.id);
    
    if (got) {
      div.innerHTML += `<div class="stamp">${s.name}：✅ 獲得済</div>`;
    } else {
      // 未獲得の場合は、個別の判定ボタンを配置
      div.innerHTML += `
        <div class="stamp">
          ${s.name}：❌ 
          <button onclick="tryGetStamp('${s.id}')" style="font-size:14px; padding:4px 8px; margin-left:10px;">ここでスタンプを押す</button>
        </div>`;
    }
  });
}
//🍎リセット機能
function resetStamps() {
  if (confirm("スタンプと歩いた足跡、行きたい場所をすべて消去しますか？")) {
    spots.forEach(s => {
      localStorage.removeItem("stamp_" + s.id);
      localStorage.removeItem("wish_" + s.id); // 👈 黄色のデータも削除
    });
    trackDots.forEach(dot => map.removeLayer(dot));
    trackDots = [];
    
    updateMapMarkers(); 
    showStamps();       
    document.getElementById("message").textContent = "";
  }
}

////////////軌跡ここから
// === 軌跡（ドット記録）機能の変数 ===
let watchId = null;          // GPSの継続監視を管理するID
let trackDots = [];          // 地図上に打った「てんてん」のマークを保存する箱
let lastDotTime = 0;         // 最後にドットを打った時刻（ミリ秒）

// === 🏁 スタンプラリー開始 ===
function startTracking() {
  if (!navigator.geolocation) {
    alert("お使いのブラウザは位置情報の追跡に対応していません");
    return;
  }
  if (watchId !== null) return; 

  alert("🏁 記録を開始しました！30秒ごとに地図に足跡（てんてん）が刻まれます。");
  
  document.getElementById("startBtn").disabled = true;
  document.getElementById("stopBtn").disabled = false;

  // リセット
  trackDots = [];
  lastDotTime = 0; 

  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const uLat = pos.coords.latitude;
      const uLng = pos.coords.longitude;

      currentLat = uLat;
      currentLng = uLng;

      // 現在地マーク（青丸）を自動移動
      if (currentLocationMarker) {
        currentLocationMarker.setLatLng([uLat, uLng]);
      } else {
        currentLocationMarker = L.circleMarker([uLat, uLng], {
          radius: 8, color: "blue", fillColor: "blue", fillOpacity: 0.8
        }).addTo(map);
      }

      // 【時間判定】現在の時刻（ミリ秒）を取得
      const now = Date.now();

      // 初回、または前回のドット作成から30000ミリ秒（30秒）以上経過しているか判定
      if (lastDotTime === 0 || (now - lastDotTime) >= 30000) {
        
        // 小さな赤いドットを地図上に配置（線は引かない）
        const dot = L.circleMarker([uLat, uLng], {
          radius: 4,          // 点の大きさ
          color: "red",       // 点の色
          fillColor: "red",
          fillOpacity: 0.6,
          stroke: false       // 枠線を消して滑らかな丸にする
        }).addTo(map);

        // あとで一括消去できるように箱に保存
        trackDots.push(dot);

        // 最後にドットを打った時間を今に更新
        lastDotTime = now;
      }
    },
    (err) => {
      console.error("位置の追跡に失敗しました:", err.message);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

// === 🎯 ゴール（追跡ストップ） ===
function stopTracking() {
  if (watchId === null) return;

  navigator.geolocation.clearWatch(watchId);
  watchId = null;

  alert("🎯 ゴール！お疲れ様でした。歩いた足跡が地図に残ります。");

  document.getElementById("startBtn").disabled = false;
  document.getElementById("stopBtn").disabled = true;
}


// ※【注意】以前のリセット機能（resetStamps）に、打った点（てんてん）も一緒に消す処理を追加しておきます
function resetStamps() {
  if (confirm("スタンプと歩いた足跡をすべて消しますか？")) {
    spots.forEach(s => {
      localStorage.removeItem("stamp_" + s.id);
    });
    // 画面上のてんてんをすべて消去
    trackDots.forEach(dot => map.removeLayer(dot));
    trackDots = [];
    
    updateMapMarkers(); 
    showStamps();       
    document.getElementById("message").textContent = "";
  }
}

// 初期起動時の実行
updateMapMarkers();
showStamps();
</script>
